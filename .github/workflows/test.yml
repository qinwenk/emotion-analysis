name: Synthetic tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r skills/chat-relationship-workflow/requirements.txt
      - name: Run synthetic unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run synthetic database reader tests
        run: python skills/chat-relationship-workflow/scripts/desktop_db_reader.py --self-test
